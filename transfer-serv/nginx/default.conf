# Generic HTTP template. Configure HTTPS at your reverse proxy.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 16m;
    client_body_timeout 150s;
    send_timeout 150s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /e2ee-worker.js {
        expires -1;
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Transfer-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
        fastcgi_buffering off;
        fastcgi_read_timeout 150s;
    }
}
