server {
    listen 80;
    server_name _;

    # Only the wireguard relay may supply the public client IP.
    set_real_ip_from 10.77.0.1;
    real_ip_header X-Real-IP;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
	proxy_pass http://gateway:3000;
	
	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $http_host;
    proxy_set_header X-Transfer-Client-IP $remote_addr;

	proxy_request_buffering off;
	proxy_buffering off;
	proxy_max_temp_file_size 0;

	proxy_connect_timeout 5s;
	proxy_send_timeout 180s;
	proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_pass php:9000;
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
    }

    location ~ /\. {
        deny all;
    }
}
