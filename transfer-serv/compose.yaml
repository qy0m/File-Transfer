services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile

    environment:
      DATABASE_PATH: /data/database/transfers.sqlite3
      UPLOAD_PATH: /data/uploads
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      MAX_STORAGE_BYTES: "100000000000"
      MIN_FREE_DISK_BYTES: "5000000000"
      MAX_STORED_TRANSFERS: "10000"
      PYTHONUNBUFFERED: "1"
      TRUSTED_PROXY_NETWORKS: "${TRUSTED_PROXY_NETWORKS:-172.18.0.0/16}"

    volumes:
      - type: bind
        source: /srv/transfers/database
        target: /data/database
        bind:
          create_host_path: false

      - type: bind
        source: /srv/transfers/uploads
        target: /data/uploads
        bind:
          create_host_path: false

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          assert json.load(urllib.request.urlopen(
          'http://127.0.0.1:8000/health',
          timeout=3)).get('ok') is True
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile

    environment:
      API_URL: http://api:8000
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health',
          {signal: AbortSignal.timeout(3000)})
          .then(async r => {
          if (!r.ok || (await r.json()).ok !== true)
          process.exit(1);
          }).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: php

    environment:
      TRANSFER_API_URL: http://api:8000

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: web

    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "10.77.0.2:${HTTP_PORT:-8080}:80"

    depends_on:
      php:
        condition: service_started
      gateway:
        condition: service_healthy

    restart: unless-stopped
